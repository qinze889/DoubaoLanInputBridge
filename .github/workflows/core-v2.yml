name: Shengjian core v2
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python -m pip install -r server/requirements-v2.txt -r server/requirements-agent.txt pytest aiohttp==3.14.5
      - name: Verify ownership, task recovery, approvals and usage settlement
        run: python -m pytest tests/test_harness_chat.py tests/test_visual_chat.py tests/test_voice_agent.py tests/test_app_agent_runtime.py tests/test_cloud_login.py tests/test_core_v2.py tests/test_core_providers.py tests/test_gateway_voice.py tests/test_official_voice.py tests/test_desktop_agent.py tests/test_stream_voice.py tests/test_gateway_stream_adapter.py -q
      - name: Install audio decoder
        run: sudo apt-get install -y ffmpeg
      - name: Verify decoder latency without truncating audio
        run: python scripts/check_stream_decoder.py
      - run: npm ci --prefix desktop
      - run: npx --prefix desktop playwright install --with-deps chromium
      - name: Exercise mobile and desktop console
        env:
          SHENGJIAN_TEST_PYTHON: python
        run: |
          node scripts/smoke_core_ui.cjs
          node scripts/smoke_stream_voice.cjs
          node scripts/smoke_harness_chat.cjs
          node scripts/test_voice_dsp.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Shengjian-core-ui
          path: artifacts/core-ui/
          if-no-files-found: error
