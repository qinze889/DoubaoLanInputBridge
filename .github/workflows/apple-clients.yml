name: Apple clients
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify shared-file import lifecycle and validation
        run: |
          xcrun swiftc -parse-as-library native/ShareImport.swift tests/native/ShareImportChecks.swift -o /tmp/shengjian-share-import-checks
          /tmp/shengjian-share-import-checks
      - name: Fetch verified Cloudflare binary
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          mkdir -p tools/cloudflared
          curl --fail --location --retry 3 https://github.com/cloudflare/cloudflared/releases/download/2026.10.2/cloudflared-darwin-arm64.tgz -o tools/cloudflared/archive.tgz
          echo '529a07089ac2d46762578389230fa148e5cb6ce2689200fc006956864042d17a  tools/cloudflared/archive.tgz' | shasum -a 256 -c -
          tar -xzf tools/cloudflared/archive.tgz -C tools/cloudflared
          chmod +x tools/cloudflared/cloudflared
          echo "$PWD/tools/cloudflared" >> "$GITHUB_PATH"
      - name: Test and build native Mac app, DMG and ZIP
        env:
          QT_QPA_PLATFORM: offscreen
        run: DOUBAO_BRIDGE_DATA_DIR="$(mktemp -d)" bash scripts/build_macos.sh
      - name: Verify distributable packages and frozen P2P transfer
        run: .venv/bin/python scripts/verify_macos_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Shengjian-macos-arm64
          path: dist/macos/
          if-no-files-found: error
          retention-days: 30
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios
      - name: Build iOS simulator app
        run: xcodebuild -project ios/ShengjianIOS.xcodeproj -scheme ShengjianIOS -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
