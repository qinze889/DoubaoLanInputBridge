name: Publish verified release assets
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        default: v1.4.0
        type: string
      windows_run_id:
        description: Successful Windows client run of the tagged commit
        required: true
        type: string
      apple_run_id:
        description: Successful Apple clients run of the tagged commit
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REL_TAG: ${{ inputs.tag }}
      WIN_RUN_ID: ${{ inputs.windows_run_id }}
      APPLE_RUN_ID: ${{ inputs.apple_run_id }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate draft and run inputs
        shell: bash
        run: |
          [[ "$REL_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$WIN_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$APPLE_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(gh release view "$REL_TAG" --json isDraft --jq .isDraft)" = true
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read source workflow results
        shell: bash
        run: |
          gh api "repos/$GH_REPO/actions/runs/$WIN_RUN_ID" > /tmp/windows-run.json
          gh api "repos/$GH_REPO/actions/runs/$APPLE_RUN_ID" > /tmp/apple-run.json
      - uses: actions/download-artifact@v4
        with:
          name: Shengjian-windows-x64
          path: verified-windows
          run-id: ${{ inputs.windows_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Shengjian-macos-arm64
          path: verified-macos
          run-id: ${{ inputs.apple_run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact source, checksums and stage all release assets
        shell: bash
        run: |
          python scripts/release_assets.py --tag "$REL_TAG" --repository "$GH_REPO" \
            --windows-run /tmp/windows-run.json --apple-run /tmp/apple-run.json \
            --windows-run-id "$WIN_RUN_ID" --apple-run-id "$APPLE_RUN_ID" \
            --windows verified-windows --macos verified-macos --output release-assets
      - name: Upload verified assets to draft release
        shell: bash
        run: |
          test "$(gh release view "$REL_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$REL_TAG" release-assets/* --clobber
