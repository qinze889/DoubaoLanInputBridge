name: Windows client
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npx playwright install chromium
        working-directory: desktop
      - run: npm run lint
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: npm run test:ui
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Shengjian-windows-ui
          path: build/windows-ui-check/
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 14 }}
  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: python -m pip install -r requirements-windows.txt
      - name: Windows regression and protocol tests
        run: python -m pytest -q tests
      - name: Fetch verified Cloudflare binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/cloudflared | Out-Null
          Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/download/2026.10.2/cloudflared-windows-amd64.exe -OutFile tools/cloudflared/cloudflared.exe
          $hash = (Get-FileHash tools/cloudflared/cloudflared.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '12c7c887f8aaab779aef1dfa9b60673530a5adb88ecc55dd6df8f56e0b70f199') { throw 'Cloudflare checksum mismatch' }
          Copy-Item docs/cloudflared-LICENSE tools/cloudflared/LICENSE
      - name: Build Windows Tauri installer with bundled tunnel
        shell: pwsh
        run: ./scripts/build_tauri.ps1 -PythonExe (Get-Command python).Source
      - name: Verify mobile Web at small viewport sizes
        shell: pwsh
        run: |
          Push-Location desktop
          try { npx playwright install chromium } finally { Pop-Location }
          node scripts/smoke_mobile_web_ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Shengjian-mobile-ui
          path: build/mobile-ui-check/phone-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify installed upgrade and two-way transfer
        shell: pwsh
        run: |
          $installer = (Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe).FullName
          python scripts/smoke_windows_installer.py --installer $installer --expected-service desktop/sidecar-dist/bridge-service.exe
      - name: Verify frozen P2P data channels
        run: python scripts/smoke_packaged_rtc.py --service desktop/sidecar-dist/bridge-service.exe
      - name: Verify real Cloudflare public access from the installed NSIS package
        id: cloudflare_e2e
        timeout-minutes: 8
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, sys, tempfile
          from PyInstaller.archive.readers import CArchiveReader

          root = pathlib.Path.cwd()
          evidence = root / 'build/cloudflare-e2e-evidence/windows'
          evidence.mkdir(parents=True, exist_ok=True)
          record = {'platform': 'windows', 'status': 'running', 'stage': 'select_installer',
                    'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'workflow_run': os.environ['GITHUB_RUN_ID']}
          def digest(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          def save_record():
              (evidence / 'package.json').write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
          save_record()
          try:
              installers = list((root / 'desktop/src-tauri/target/release/bundle/nsis').glob('*.exe'))
              assert len(installers) == 1, 'Expected one NSIS installer'
              installer = installers[0]
              record['installer_sha256'] = digest(installer)
              with tempfile.TemporaryDirectory(prefix='shengjian-cf-package-', dir=os.environ['RUNNER_TEMP']) as temporary:
                  install = pathlib.Path(temporary) / 'installed'
                  install.mkdir()
                  record['stage'] = 'install_nsis'
                  save_record()
                  # NSIS requires /D last, without quotes, even when its path has spaces.
                  subprocess.run(f'"{installer}" /S /D={install}', check=True, timeout=120,
                                 stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  service = install / 'bridge-service.exe'
                  record['stage'] = 'verify_installed_payload'
                  assert service.is_file(), 'Installed backend is missing'
                  assert digest(service) == digest(root / 'desktop/sidecar-dist/bridge-service.exe'), 'Installed backend differs'
                  assert (install / 'VERSION').read_text().strip() == (root / 'VERSION').read_text().strip(), 'Installed version differs'
                  # Extract the reference binary from the final installed onefile payload.
                  # The smoke test compares it with the backend's running _MEIPASS binary.
                  archive = CArchiveReader(str(service))
                  assert 'cloudflared.exe' in archive.toc, 'Bundled cloudflared is missing'
                  binary = archive.extract('cloudflared.exe')
                  assert binary and len(binary) > 1_000_000, 'Bundled cloudflared is incomplete'
                  cloudflared = pathlib.Path(temporary) / 'cloudflared.exe'
                  cloudflared.write_bytes(binary)
                  record.update(service_sha256=digest(service), cloudflared_sha256=digest(cloudflared), stage='public_e2e')
                  save_record()
                  subprocess.run([sys.executable, str(root / 'scripts/smoke_cloudflare.py'),
                                  '--cloudflared', str(cloudflared), '--service', str(service),
                                  '--service-kind', 'gui', '--timeout', '180', '--output', str(evidence)],
                                 check=True, timeout=300)
                  record['stage'] = 'cleanup_package'
              record.update(status='passed', stage='complete')
          except Exception as error:
              record.update(status='failed', error_type=type(error).__name__)
              save_record()
              raise SystemExit('Packaged Cloudflare public check failed; see sanitized evidence.') from None
          save_record()
      - name: Upload sanitized Windows Cloudflare evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shengjian-windows-cloudflare-e2e
          path: |
            build/cloudflare-e2e-evidence/windows/package.json
            build/cloudflare-e2e-evidence/windows/result.json
            build/cloudflare-e2e-evidence/windows/service.log
            build/cloudflare-e2e-evidence/windows/cloudflare.log
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
      - name: Stage Windows downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*.exe dist/windows/Shengjian-windows-x64-setup.exe
          Copy-Item docs/cloudflared-LICENSE dist/windows/cloudflared-LICENSE.txt
          Copy-Item docs/INSTALL-Windows.txt dist/windows/
          @{version=(Get-Content VERSION).Trim(); source_commit=(git rev-parse HEAD); workflow_run=$env:GITHUB_RUN_ID; architecture='x64'; installed_upgrade_and_transfer_verified=$true; frozen_p2p_verified=$true; cloudflare_public_e2e_verified=$true} | ConvertTo-Json | Set-Content dist/windows/Windows-build.json -Encoding utf8
          Get-ChildItem dist/windows -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/windows/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Shengjian-windows-x64
          path: dist/windows/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

