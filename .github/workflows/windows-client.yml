name: Windows client
on:
  pull_request:
  push:
    branches: [main, feat/shengjian-core-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npx playwright install chromium
        working-directory: desktop
      - run: npm run lint
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: npm run test:ui
        working-directory: desktop
      - name: Reject foreign and stale local service identities
        run: node scripts/test_local_service_ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Shengjian-windows-ui
          path: build/windows-ui-check/
          retention-days: 14
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: python -m pip install -r requirements-windows.txt
      - name: Windows regression and protocol tests
        run: python -m pytest -q tests
      - name: Fetch verified Cloudflare binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/cloudflared | Out-Null
          Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/download/2026.10.2/cloudflared-windows-amd64.exe -OutFile tools/cloudflared/cloudflared.exe
          $hash = (Get-FileHash tools/cloudflared/cloudflared.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '12c7c887f8aaab779aef1dfa9b60673530a5adb88ecc55dd6df8f56e0b70f199') { throw 'Cloudflare checksum mismatch' }
          Copy-Item docs/cloudflared-LICENSE tools/cloudflared/LICENSE
      - name: Build Windows apps with bundled tunnel
        shell: pwsh
        run: ./scripts/build_tauri.ps1 -PythonExe (Get-Command python).Source
      - name: Verify sidecar process ownership including one-file bootloader
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib
      - name: Verify installed upgrade and two-way transfer
        shell: pwsh
        run: |
          $installer = (Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe).FullName
          python scripts/smoke_windows_installer.py --installer $installer --expected-service desktop/sidecar-dist/bridge-service.exe
      - name: Verify frozen P2P data channels
        run: python scripts/smoke_packaged_rtc.py --service desktop/sidecar-dist/bridge-service.exe
      - name: Stage Windows downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*.exe dist/windows/Shengjian-windows-x64-setup.exe
          Copy-Item dist/Shengjian-windows-x64.exe dist/windows/
          Copy-Item docs/cloudflared-LICENSE dist/windows/cloudflared-LICENSE.txt
          Copy-Item docs/INSTALL-Windows.txt dist/windows/
          @{version=(Get-Content VERSION).Trim(); source_commit=(git rev-parse HEAD); workflow_run=$env:GITHUB_RUN_ID; architecture='x64'; installed_upgrade_and_transfer_verified=$true; frozen_p2p_verified=$true} | ConvertTo-Json | Set-Content dist/windows/Windows-build.json -Encoding utf8
          Get-ChildItem dist/windows -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/windows/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Shengjian-windows-x64
          path: dist/windows/
          if-no-files-found: error
          retention-days: 30
