name: Fast checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Draft PR: lint, typecheck, Python syntax and critical static contracts.
# Ready PR: these fast checks AND the separate Windows/Apple full CI.
jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run lint
        working-directory: desktop
      - run: npm run build
        working-directory: desktop

  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-windows.txt
      - run: python -m pip install pytest==9.1.1 certifi==2026.10.23
      - run: python -m compileall -q src server
      - name: Check Cloudflare public probe syntax
        run: python -m py_compile scripts/smoke_cloudflare.py
      - name: Test CI gates, release integrity and desktop contracts
        run: python -m pytest -q tests/test_ci_tiers.py tests/test_release_assets.py tests/test_tauri_desktop_ui.py tests/test_cloudflare_runtime.py tests/test_cloudflare_ca.py

