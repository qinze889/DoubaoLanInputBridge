# Include ONLY inside the existing HTTPS server block for test.xjiaoai.com.
location = /shengjian { return 308 /shengjian/; }
location ^~ /shengjian/ {
    proxy_pass http://127.0.0.1:18766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 100s;
    proxy_send_timeout 100s;
    client_max_body_size 24m;
    proxy_buffering off;
    proxy_request_buffering off;
    client_body_buffer_size 24m;
    access_log off;
    error_log /var/log/nginx/shengjian-error.log crit;
}
