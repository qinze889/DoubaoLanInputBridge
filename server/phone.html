<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>声笺</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--muted:#8e8e93;--soft:#f5f5f7;--blue:#007aff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);padding:max(28px,env(safe-area-inset-top)) 20px max(30px,env(safe-area-inset-bottom))}main{max-width:560px;margin:auto}header{padding:12px 4px 24px}h1{font-size:36px;letter-spacing:-1.5px;margin:0 0 8px}p{line-height:1.6;color:var(--muted);margin:8px 0}.badge{float:right;font-size:12px;background:#8e8e9318;padding:7px 11px;border-radius:20px;color:var(--muted)}.online{color:#248a3d;background:#34c75918}.card{background:var(--card);padding:22px;border-radius:24px;margin-bottom:16px;animation:appear .35s both}textarea,input[type=password]{width:100%;border:0;background:var(--soft);color:var(--ink);-webkit-text-fill-color:var(--ink);border-radius:17px;padding:17px;font:17px/1.6 inherit;resize:vertical;outline:0}textarea{font:17px/1.7 -apple-system,sans-serif;min-height:180px}textarea:focus,input:focus{box-shadow:0 0 0 3px #007aff28}button,.filepicker{border:0;border-radius:15px;padding:14px 18px;background:var(--soft);color:var(--blue);font:600 16px -apple-system,sans-serif;cursor:pointer;transition:transform .16s,opacity .16s}button:active,.filepicker:active{transform:scale(.97)}button:disabled{opacity:.45;cursor:wait}.primary{background:var(--blue);color:white;width:100%;margin-top:18px;min-height:54px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}.small{font-size:13px}input[type=checkbox]{accent-color:#34c759;width:20px;height:20px}.hint{font-size:14px;white-space:pre-wrap;min-height:20px}.error{color:#ff453a}.success{color:#248a3d}.filepicker{display:inline-block;font-size:14px;padding:10px 14px}input[type=file]{display:none}h2{font-size:17px;margin:0 0 12px}a{color:var(--blue);text-decoration:none;word-break:break-word}.item{padding:14px 0;border-bottom:1px solid #8e8e9322}pre{white-space:pre-wrap;word-break:break-all}details summary{color:var(--muted);font-size:14px;cursor:pointer}@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--soft:#2c2c2e}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><main><header><span class="badge" id="status">连接中</span><h1>声笺</h1><p id="device">随手说，随处写。</p></header>
<section class="card" id="login" hidden><h2>连接电脑</h2><p class="small">请从电脑后台扫码，或粘贴连接码。</p><input id="code" type="password" autocomplete="off" placeholder="连接码"><button class="primary" id="connect">连接</button></section>
<section class="card"><textarea id="text" placeholder="想写的话，轻轻放在这里。" aria-label="要发送的文字"></textarea><div class="row"><label class="small"><input id="enter" type="checkbox"> 粘贴后回车</label><label class="filepicker">添加文件<input id="files" type="file" multiple></label></div><p id="selected" class="small"></p><button class="primary" id="send" disabled>发送到电脑</button><p id="message" class="hint" role="status" aria-live="polite"></p><details><summary>发送到哪里？</summary><p class="small">发送前，请在电脑上点一下目标输入框。文件和文字也会保存在电脑的声笺记录中。手机不会替你选择输入框。</p></details></section>
<section class="card"><div class="row" style="margin-top:0"><h2>电脑分享</h2><button id="refresh" style="padding:8px 12px;font-size:13px">刷新</button></div><div id="shared"><p class="small">电脑发布的文字和文件会出现在这里。</p></div></section><p class="small" style="text-align:center">经你的 47 服务器连接 · HTTPS</p></main>
<script>
const $=id=>document.getElementById(id);const base=location.pathname.replace(/\/?$/,'/');let busy=false,ready=false,pendingFiles=[];
function message(text,error=false){$('message').textContent=text;$('message').className='hint '+(error?'error':'success')}
async function api(path,options={}){const res=await fetch(base+path,{...options,cache:'no-store'});let data;try{data=await res.json()}catch{throw Error('服务暂时不可用，请稍后再试')}if(!res.ok||!data.ok){if(res.status===401)$('login').hidden=false;throw Error(data.error||'请求未完成')}return data}
async function connect(code){await api('login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});$('login').hidden=true;$('code').value='';await status();await shared()}
async function status(){try{const s=await api('status');ready=s.online;$('device').textContent=s.name;$('status').textContent=s.online?'电脑在线':'电脑离线';$('status').className='badge'+(s.online?' online':'');if(s.online&&!s.can_paste&&!busy)message('电脑尚未开启辅助功能权限，请在电脑系统设置中授权声笺。',true);$('send').disabled=busy||!ready}catch(e){ready=false;$('status').textContent='未连接';$('send').disabled=true}}
async function shared(){try{const data=await api('r/files/shared');$('shared').replaceChildren();for(const item of data.items||[]){const el=document.createElement('div');el.className='item';if(item.type==='text'){const btn=document.createElement('button');btn.textContent=item.text||item.preview||item.name||'文字';btn.onclick=async()=>{try{await navigator.clipboard.writeText(item.text||'');message('文字已复制')}catch{message('请长按文字复制')}};el.append(btn)}else{const a=document.createElement('a');a.textContent=item.name;a.href=base+'r/files/download?file='+encodeURIComponent(item.name);a.target='_blank';a.rel='noopener';el.append(a)}$('shared').append(el)}if(!$('shared').children.length)$('shared').textContent='暂无分享内容'}catch(e){$('shared').textContent=e.message}}
$('connect').onclick=()=>connect($('code').value.trim()).catch(e=>message(e.message,true));$('refresh').onclick=shared;
$('files').onchange=()=>{pendingFiles=Array.from($('files').files);$('selected').textContent=pendingFiles.map(f=>f.name).join('、')};
$('send').onclick=async()=>{if(busy)return;const text=$('text').value,files=[...pendingFiles];if(!text.trim()&&!files.length){message('先写点文字，或添加一个文件。',true);return}if(files.some(f=>f.size>15*1024*1024)){message('单个文件请小于 15 MiB。',true);return}busy=true;$('send').disabled=true;message('正在等待电脑接收…');let completed=0;try{if(text.trim()){await api('r/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,press_enter:$('enter').checked,enter_delay_sec:.5})});$('text').value='';completed++}for(const file of files){const form=new FormData();form.append('files',file);await api('r/files/paste',{method:'POST',body:form});completed++;pendingFiles.shift();$('selected').textContent=pendingFiles.map(f=>f.name).join('、');} $('files').value='';$('selected').textContent='';message('电脑已接收并执行粘贴。')}catch(e){message((completed?'前 '+completed+' 项已完成。':'')+e.message,true)}finally{busy=false;$('send').disabled=!ready}};
(async()=>{const code=location.hash.slice(1);history.replaceState(null,'',location.pathname);if(code){try{await connect(code)}catch(e){message(e.message,true)}}else{await status();if(ready)await shared()}setInterval(status,10000)})();
</script></html>
