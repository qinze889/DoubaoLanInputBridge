# Include beside the existing /shengjian/ location, inside the HTTPS server.
location = /shengjian/api/v2 { return 308 /shengjian/api/v2/console; }
location ^~ /shengjian/api/v2/ {
    proxy_pass http://127.0.0.1:18767;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    # Audio frames are WebSocket messages. JSON HTTP requests stay bounded.
    client_max_body_size 128k;
}
