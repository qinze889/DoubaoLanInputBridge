<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声笺 · 设备管理</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f2f7;color:#1c1c1e}*{box-sizing:border-box}main{max-width:900px;margin:60px auto;padding:0 24px}h1{font-size:36px;letter-spacing:-1.2px;margin:0 0 8px}p{color:#8e8e93;line-height:1.6}.card{background:white;border-radius:22px;padding:24px;margin-top:20px}.row{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}button{border:0;border-radius:12px;padding:12px 18px;background:#007aff;color:white;font:600 14px -apple-system,sans-serif;cursor:pointer;transition:transform .15s}button:active{transform:scale(.97)}input{border:0;background:#f2f2f7;padding:14px;border-radius:12px;font-size:16px;max-width:100%;flex:1}.muted{background:#f2f2f7;color:#007aff}.danger{background:#ff3b3010;color:#ff3b30}.badge{color:#248a3d;background:#34c75918;border-radius:20px;padding:6px 12px;font-size:12px}.offline{color:#8e8e93;background:#8e8e9318}.device{padding:20px 0;border-top:1px solid #f2f2f7}h2{font-size:18px}code,pre{white-space:pre-wrap;word-break:break-all}a{color:#007aff}#message{color:#ff3b30}dialog{border:0;border-radius:24px;max-width:90vw;padding:28px}dialog::backdrop{background:#0005}canvas{display:block;margin:16px auto}label{font-size:14px;color:#8e8e93}@media(prefers-color-scheme:dark){:root{background:#000;color:#f5f5f7}.card,dialog{background:#1c1c1e;color:#f5f5f7}input,.muted{background:#2c2c2e;color:#0a84ff}.device{border-color:#38383a}}
</style><main><div class="row"><div><h1>你的设备，随时相连。</h1><p>声笺 · 47 服务器管理后台</p></div><span class="badge">HTTPS 中转</span></div><section class="card" id="login"><h2>登录管理后台</h2><div class="row"><input id="code" type="password" autocomplete="off" placeholder="管理口令"><button id="signin">登录</button></div></section><section id="panel" hidden><div class="card"><div class="row"><h2>连接的电脑</h2><button id="add">添加设备</button></div><p id="stats"></p><div id="devices"></div></div><p>电脑主动连接服务器。手机端不需要局域网、VPN 或 Cloudflare 临时地址。发送内容只临时中转，后台仅统计结果。</p></section><p id="message" role="status"></p></main><dialog id="dialog"><h2 id="title">连接手机</h2><div id="detail"></div><button id="close">完成</button></dialog>
<script>
const $=id=>document.getElementById(id),base=location.pathname.replace(/\/?$/,'/');let credential;
async function api(path,data){const r=await fetch(base+path,{cache:'no-store',...(data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{})});const result=await r.json();if(!r.ok||!result.ok)throw Error(result.error||'操作失败');return result}
async function load(){try{const r=await api('admin/devices');$('login').hidden=true;$('panel').hidden=false;$('stats').textContent='已完成 '+r.stats.delivered+' 次请求 · 失败 '+r.stats.failed+' 次';$('devices').replaceChildren();for(const d of r.devices){const row=document.createElement('div');row.className='device row';const info=document.createElement('div'),name=document.createElement('strong'),badge=document.createElement('span');name.textContent=d.name;badge.textContent=d.enabled?(d.online?'在线':'离线'):'已停用';badge.className='badge'+(d.online&&d.enabled?'':' offline');info.append(name,document.createTextNode('　'),badge);row.append(info);const actions=document.createElement('div');if(d.enabled){const phone=document.createElement('button');phone.className='muted';phone.textContent='连接手机';phone.onclick=()=>showPhone(d);const revoke=document.createElement('button');revoke.className='danger';revoke.style.marginLeft='8px';revoke.textContent='停用';revoke.onclick=async()=>{if(confirm('停用 '+d.name+'？手机连接会立即失效。')){await api('admin/revoke',{id:d.id});await load()}};actions.append(phone,revoke)}row.append(actions);$('devices').append(row)}}catch(e){$('message').textContent=e.message}}
function showPhone(d){$('title').textContent=d.name+' · 连接手机';$('detail').replaceChildren();const p=document.createElement('p');p.textContent='在手机上打开此链接。链接包含设备连接码，请仅自己使用。';const a=document.createElement('a');a.href=location.origin+d.mobile_path;a.textContent='打开手机发送页';a.target='_blank';a.rel='noopener';const copy=document.createElement('button');copy.textContent='复制手机连接';copy.className='muted';copy.onclick=()=>navigator.clipboard.writeText(a.href);const qr=document.createElement('img');qr.src=base+'admin/qr?id='+d.id;qr.alt='手机连接二维码';qr.style.cssText='width:260px;max-width:100%;display:block;margin:16px auto;background:white;border-radius:12px';$('detail').append(p,qr,a,document.createElement('br'),copy);$('dialog').showModal()}
$('close').onclick=()=>$('dialog').close();$('signin').onclick=async()=>{try{await api('login',{code:$('code').value});$('code').value='';$('message').textContent='';await load()}catch(e){$('message').textContent=e.message}};
$('add').onclick=async()=>{const name=prompt('设备名称，例如 我的 Windows');if(!name)return;try{const d=await api('admin/devices',{name});credential={url:location.origin+base.replace(/\/$/,''),device_id:d.device_id,token:d.token,mobile_token:d.mobile_token,mobile_url:location.origin+base+'d/'+d.device_id+'/#'+d.mobile_token};$('title').textContent='添加 '+name;$('detail').replaceChildren();const p=document.createElement('p');p.textContent='下载设备配置，放入这台电脑的声笺数据目录，文件名为 relay.json，再重启声笺。配置只显示这一次，请勿分享。';const b=document.createElement('button');b.textContent='下载 relay.json';b.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(credential,null,2)],{type:'application/json'}));a.download='relay.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('detail').append(p,b);$('dialog').showModal();await load()}catch(e){$('message').textContent=e.message}};
(async()=>{const code=location.hash.slice(1);history.replaceState(null,'',location.pathname);if(code){try{await api('login',{code})}catch(e){$('message').textContent=e.message}}await load();setInterval(()=>{if(!$('panel').hidden)load()},10000)})();
</script></html>
